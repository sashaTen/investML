name: Monthly Job

on:
  schedule:
    - cron: '12 4 3 * *'  # 13:07 KST (UTC+9)
  workflow_dispatch:
jobs:
  monthly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ml_code
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GSP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: investml-484904

      - name: Verify auth
        run: |
          gcloud auth list
          gcloud config list project

      - name: Configure Docker for Artifact Registry
        working-directory: ml_code
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev

      - name: Create Artifact Registry (if not exists)
        run: |
          gcloud artifacts repositories create retrain \
            --repository-format=docker \
            --location=asia-northeast3 \
            --description="Docker for re-train" || echo "Repo already exists"

      - name: Build and Push Docker Image
        working-directory: ml_code
        run: |
          gcloud builds submit \
            --tag asia-northeast3-docker.pkg.dev/investml-484904/retrain/retrain:latest
      
      - name: Update or Create Cloud Run Job
        env:
         KEY_GITHUB: ${{ secrets.KEY_GITHUB }}
        run: |
          gcloud run jobs update my-data-transformation \
            --image=asia-northeast3-docker.pkg.dev/investml-484904/retrain/retrain:latest \
            --region=asia-northeast3 \
            --memory=2Gi \
            --cpu=2 \
            --set-env-vars KEY_GITHUB=$KEY_GITHUB \
          || gcloud run jobs create my-data-transformation \
            --image=asia-northeast3-docker.pkg.dev/investml-484904/retrain/retrain:latest \
            --region=asia-northeast3 \
            --memory=2Gi \
            --cpu=2 \
            --set-env-vars  KEY_GITHUB=$KEY_GITHUB

      - name: Execute Cloud Run Job
        working-directory: ml_code
        run: |
          gcloud run jobs execute my-data-transformation \
            --region=asia-northeast3
