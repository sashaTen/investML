name: Django CI

on:
  push:
    branches: [ "main" ]
  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs_run.txt
   
      - name: Run unit tests
        run: |
          pytest 
      - name: Run greeting
        run: |
          echo "hello  world"
      - name: create file
        run: |
          touch newfile.txt
          echo "This is a new file" > newfile.txt   
          cat newfile.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GSP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: investml-484904

      - name: Verify auth
        run: |
          gcloud auth list
          gcloud config list project
      - name: Build and deploy
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          gcloud auth list
          gcloud config list project

          gcloud artifacts repositories create invest-repo \
            --repository-format=docker \
            --location=asia-northeast3 \
            --description="Docker repo for InvestML" || true

          gcloud builds submit \
            --tag asia-northeast3-docker.pkg.dev/investml-484904/invest-repo/invest-app:latest

          gcloud run deploy invest-app \
            --image asia-northeast3-docker.pkg.dev/investml-484904/invest-repo/invest-app:latest \
            --region asia-northeast3 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars THE_KEY=$THE_KEY


                
