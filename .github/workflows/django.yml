name: Django CI

on:
  push:
    branches: [ "main" ]
  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs_run.txt
   
      - name: Run unit tests
        run: |
          pytest 
      - name: Run greeting
        run: |
          echo "hello  world"
      - name: create file
        run: |
          touch newfile.txt
          echo "This is a new file" > newfile.txt   
          cat newfile.txt




    